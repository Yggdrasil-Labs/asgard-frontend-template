name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    # 仅由 push / workflow_dispatch 触发（release-please-action 官方推荐模式）：
    # 移除 pull_request 触发，因为 release-please 每次运行都会 force-push 自己的
    # release 分支，若同时监听 pull_request.synchronize，会形成自触发循环，
    # 且此类运行需要人工批准，导致 release PR 永远无法转绿。
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # 获取完整的 Git 历史，包括所有标签

      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        id: release
        with:
          config-file: .github/release-please-config.json
          manifest-file: .github/.release-please-manifest.json
          # 禁用自动添加标签，由后续步骤手动添加自定义标签
          skip-labeling: true
          # 禁用自动创建 GitHub Release/Tag，交由 create-tag.yml 和 release.yml 处理
          # 这样可以使用 PAT (RELEASE_TOKEN) 创建 Tag，从而自动触发 Release 构建工作流
          skip-github-release: true

      - name: Add 🚀 release label to PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Waiting for PR to be searchable..."
          # 简单的重试逻辑：尝试 5 次，每次间隔 5 秒
          for i in {1..5}; do
            # 显式指定 repo 以避免需要 checkout
            PR_NUMBER=$(gh pr list --repo ${{ github.repository }} --search "head:release-please--branches--main is:open" --json number --jq '.[0].number')

            if [ -n "$PR_NUMBER" ] && [ "$PR_NUMBER" != "null" ]; then
              echo "Found Release PR: #$PR_NUMBER"
              gh pr edit "$PR_NUMBER" --repo ${{ github.repository }} --add-label "🚀 release"
              echo "Added '🚀 release' label to PR #$PR_NUMBER"
              exit 0
            fi

            echo "Attempt $i: No open release PR found yet. Retrying in 5s..."
            sleep 5
          done

          echo "No open release PR found after retries."
          # 不报错退出，避免标记 workflow 为失败
          exit 0

  # 注意：实际的构建和 GitHub Release 创建由 release.yml 在 tag 推送时触发
  # Tag 由 create-tag.yml 在 Release PR 合并后创建
  log-release:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    steps:
      - name: Log release info
        run: |
          echo "🏷️ Release Please updated manifest"
          echo "📦 Version: ${{ needs.release-please.outputs.version }}"
          echo "🔄 The create-tag.yml workflow will create the tag"
          echo "🔄 Then release.yml will be triggered by the tag push"
