# Dependabot configuration
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # ===== JavaScript/TypeScript (npm/yarn/pnpm) =====
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 10
    target-branch: "main"
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
      include: "scope"
    labels:
      - "📦 deps"
    reviewers:
      - "Yggdrasil-Labs/reviewers"
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
      dev-deps:
        patterns:
          - "eslint*"
          - "@types/*"
          - "typescript"
          - "vitest"
          - "jest*"
          - "webpack*"
          - "rollup*"
          - "vite*"
    ignore:
      # TypeScript 7 为破坏性升级：当前 typescript-eslint 工具链尚不支持（ESLint 崩溃）。
      # 待 @antfu/eslint-config / typescript-eslint 官方支持 TS 7 后解除此规则。
      - dependency-name: "typescript"
        versions: [">=7.0.0"]

  # ===== GitHub Actions (repo-wide) =====
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "02:30"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 10
    target-branch: "main"
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "🧰 infra"
      - "📦 deps"
    reviewers:
      - "Yggdrasil-Labs/reviewers"
    ignore:
      # release-please-action v5 为破坏性大改版，需完成配置迁移（独立任务）后再解除此规则。
      - dependency-name: "googleapis/release-please-action"
        versions: [">=5.0.0"]

  # ===== Dockerfiles (repo root) =====
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "02:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 10
    target-branch: "main"
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "📦 deps"
    reviewers:
      - "Yggdrasil-Labs/reviewers"

# 说明：
# - 仅保留本仓库实际使用的生态：npm、github-actions、docker。
# - 语义化提交：commit-message.prefix 统一使用 chore 前缀，符合依赖/构建变更语义。
# - 自动标签：labels 将自动给 PR 打上依赖相关标签；可配合规则实现自动合并。
# - Reviewer：示例使用组织团队别名，按需替换为具体成员或团队。
# - 更新频率：统一为 weekly，并设置周一凌晨分时段，减少噪音。
# - 分组：对前端常见 dev 依赖与 minor/patch 版本进行归组，降低 PR 数量。
# - ignore 规则：typescript >=7 与 release-please-action >=5 的解除条件见上方注释。
